<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AHP Судалгаа — Төмөр замын шалгуур үзүүлэлт</title>
<style>
:root {
  --g: #0f9e6e; --gd: #085040; --gl: #e6f7f1;
  --t: #1a1a1a; --tm: #5f6672; --ts: #9ca3af;
  --bg: #f7f9f8; --s: #ffffff; --b: #e5e7eb;
  --r: 14px; --rs: 8px;
}
@media(prefers-color-scheme:dark){
  :root{ --t:#f0f0ee; --tm:#9ca3af; --ts:#6b7280;
    --bg:#111312; --s:#1c1f1e; --b:#2d3130; --gl:#0b2e22; --gd:#4fe6a8; }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--t);min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
.hdr{background:linear-gradient(135deg,#064535,#0f9e6e);color:#fff;padding:20px 16px 16px;text-align:center;position:sticky;top:0;z-index:50}
.hdr h1{font-size:14px;font-weight:600;letter-spacing:.2px;opacity:.95}
.hdr p{font-size:11px;opacity:.7;margin-top:3px}
.pt{background:rgba(255,255,255,.2);border-radius:99px;height:4px;margin-top:12px}
.pf{background:#fff;border-radius:99px;height:4px;transition:width .4s ease}
.pl{font-size:10px;opacity:.75;margin-top:4px}
.main{padding:14px;max-width:440px;margin:0 auto}
.card{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:18px 16px;margin-bottom:12px}
.intro-ttl{font-size:19px;font-weight:700;color:var(--gd);margin-bottom:8px}
.intro-p{font-size:14px;color:var(--tm);line-height:1.65;margin-bottom:8px}
.slist{margin:12px 0}
.si{display:flex;gap:10px;align-items:flex-start;margin-bottom:9px}
.sn{width:22px;height:22px;border-radius:50%;background:var(--g);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.st{font-size:14px;color:var(--t);line-height:1.5}
.scl{background:var(--gl);border-radius:var(--rs);padding:12px 14px;margin:12px 0}
.scl h4{font-size:11px;font-weight:700;color:var(--gd);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.sr{display:flex;justify-content:space-between;font-size:12px;color:var(--tm);margin-bottom:4px}
.sv{font-weight:700;color:var(--gd)}
.ni{width:100%;padding:12px 13px;border:1.5px solid var(--b);border-radius:var(--rs);font-size:15px;background:var(--bg);color:var(--t);margin-bottom:4px;outline:none;-webkit-appearance:none}
.ni:focus{border-color:var(--g)}
.nh{font-size:12px;color:var(--ts);margin-bottom:14px}
.sbtn{width:100%;padding:14px;background:var(--g);color:#fff;border:none;border-radius:var(--rs);font-size:16px;font-weight:600;cursor:pointer;letter-spacing:.2px}
.sbtn:active{background:var(--gd);transform:scale(.98)}
.sbtn:disabled{opacity:.5;cursor:not-allowed}
.qn{font-size:11px;color:var(--ts);font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
.qi{font-size:13px;color:var(--tm);margin-bottom:14px;line-height:1.55}
.cg{display:flex;gap:7px;align-items:stretch;margin-bottom:16px}
.cp{flex:1;background:var(--bg);border:2px solid var(--b);border-radius:10px;padding:12px 9px;text-align:center;transition:border-color .2s,background .2s;min-height:80px;display:flex;flex-direction:column;justify-content:center}
.cp.al{border-color:var(--g);background:var(--gl)}
.cp.ar{border-color:var(--g);background:var(--gl)}
.cp .code{font-size:10px;font-weight:800;color:var(--g);margin-bottom:5px;letter-spacing:.3px}
.cp .nm{font-size:11px;color:var(--t);line-height:1.4;font-weight:500}
.vs{font-size:10px;color:var(--ts);font-weight:700;align-self:center;flex-shrink:0}
.slw{margin-bottom:12px}
.sll{display:flex;justify-content:space-between;margin-bottom:5px}
.sll span{font-size:10px;color:var(--ts);max-width:70px;text-align:center;line-height:1.3}
input[type=range]{width:100%;height:28px;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;outline:none}
input[type=range]::-webkit-slider-runnable-track{height:6px;background:var(--b);border-radius:99px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--g);margin-top:-11px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
input[type=range]::-moz-range-track{height:6px;background:var(--b);border-radius:99px}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--g);border:none}
.cl{text-align:center;background:var(--gl);border-radius:var(--rs);padding:9px 12px;font-size:13px;font-weight:600;color:var(--gd);min-height:36px;margin-top:8px;line-height:1.4}
.br{display:flex;gap:9px;margin-top:14px}
.btn{flex:1;padding:13px;border-radius:var(--rs);font-size:14px;font-weight:600;cursor:pointer;border:1.5px solid var(--b);background:var(--s);color:var(--t);transition:all .15s}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--g);color:#fff;border-color:var(--g)}
.btn-p:active{background:var(--gd)}
.btn:disabled{opacity:.3;cursor:not-allowed}
.done-ic{font-size:48px;text-align:center;margin-bottom:12px}
.done-ttl{font-size:20px;font-weight:700;color:var(--gd);text-align:center;margin-bottom:6px}
.done-p{font-size:14px;color:var(--tm);text-align:center;line-height:1.6}
.sg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0}
.st2{background:var(--bg);border-radius:var(--rs);padding:12px;text-align:center}
.sv2{font-size:24px;font-weight:700;color:var(--g)}
.sl2{font-size:11px;color:var(--tm);margin-top:3px}
.nb{background:var(--bg);border:1px solid var(--b);border-radius:var(--rs);padding:10px 12px;font-size:12px;line-height:1.5;color:var(--tm)}
.err{background:#fef2f2;border:1px solid #fca5a5;border-radius:var(--rs);padding:12px;font-size:13px;color:#991b1b;margin-bottom:12px;line-height:1.5}
.ld{text-align:center;padding:32px 16px;color:var(--tm);font-size:14px}
</style>
</head>
<body>

<div class="hdr">
  <h1>🚂 Төмөр замын шалгуур үзүүлэлтийн судалгаа</h1>
  <p>AHP харьцуулалтын асуумж</p>
  <div id="pw" style="display:none">
    <div class="pt"><div class="pf" id="pf" style="width:0%"></div></div>
    <div class="pl" id="pl"></div>
  </div>
</div>

<div class="main"><div id="app"><div class="ld">Ачааллаж байна...</div></div></div>

<script>
// ⚠️ ЭНЭХҮҮ URL-ийг ӨӨРИЙН Apps Script deployment URL-аар солино уу
const API_URL = "YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";

const crits = [
  {id:"F1", label:"Хот суурины газруудыг холбон хөгжүүлэх боломж"},
  {id:"F2", label:"Татагдах болон холбогдох хүн амын тоо"},
  {id:"F3", label:"Бүс нутгийн хамтын ажиллагаа, тээврийн коридортой уялдах байдал"},
  {id:"F4", label:"Хөрш орнуудын тээврийн коридортой холбогдох боломж"},
  {id:"F5", label:"Аж үйлдвэрийн хөгжлийг дэмжих боломж"},
  {id:"F6", label:"Маршрутын нөхцөл байдал"},
  {id:"F7", label:"Хилийн боомтын нөхцөл байдал"},
  {id:"F9", label:"Гадаргын бартаажилтын байдал"},
  {id:"F10", label:"Бүс нутгийн эрчим хүчний хангамж"},
  {id:"Ачаа", label:"Ачаа тээврийн боломж"}
];
const n = crits.length;
const pairs = [];
for(let i=0;i<n;i++) for(let j=i+1;j<n;j++) pairs.push([i,j]);
const TOTAL = pairs.length;
const SM = [9,8,7,6,5,4,3,2,1,0.5,1/3,0.25,0.2,1/6,1/7,.125,1/9];
const RI = [0,0,.58,.9,1.12,1.24,1.32,1.41,1.45,1.49,1.51];

let state="intro", cur=0, answers=new Array(TOTAL).fill(8), uname="";

function sv(i){return SM[parseInt(i)];}

function slbl(i){
  i=parseInt(i);
  const v=SM[i], [a,b]=pairs[cur];
  if(i===8) return "Тэнцүү — хоёулаа адил чухал";
  if(i<8){
    const m={9:"Хамгийн их давуу (9)",8:"Илт давуу (8)",7:"Маш чухал (7)",6:"Нэлээд чухал (6)",5:"Чухал (5)",4:"Дунд зэрэг (4)",3:"Бага зэрэг (3)",2:"Аль зэрэг (2)"};
    return crits[a].id+" илүү чухал — "+(m[Math.round(v)]||"");
  }
  const rv=Math.round(1/v);
  const m={2:"Аль зэрэг (2)",3:"Бага зэрэг (3)",4:"Дунд зэрэг (4)",5:"Чухал (5)",6:"Нэлээд чухал (6)",7:"Маш чухал (7)",8:"Илт давуу (8)",9:"Хамгийн их давуу (9)"};
  return crits[b].id+" илүү чухал — "+(m[rv]||"");
}

function computeCR(ans){
  const mat=Array.from({length:n},()=>new Array(n).fill(1));
  pairs.forEach(([i,j],k)=>{const v=sv(ans[k]);mat[i][j]=v;mat[j][i]=1/v;});
  const cs=Array(n).fill(0);
  for(let j=0;j<n;j++) for(let i=0;i<n;i++) cs[j]+=mat[i][j];
  const norm=mat.map(r=>r.map((v,j)=>v/cs[j]));
  const w=norm.map(r=>r.reduce((s,v)=>s+v,0)/n);
  const wv=Array(n).fill(0);
  for(let i=0;i<n;i++) for(let j=0;j<n;j++) wv[i]+=mat[i][j]*w[j];
  const lm=wv.reduce((s,v,i)=>s+v/w[i],0)/n;
  const CI=(lm-n)/(n-1);
  return CI/(RI[n]||1.49);
}

function updProg(){
  const pw=document.getElementById("pw");
  if(state==="survey"){
    pw.style.display="block";
    const p=Math.round(cur/TOTAL*100);
    document.getElementById("pf").style.width=p+"%";
    document.getElementById("pl").textContent=cur+" / "+TOTAL+" асуулт дууссан";
  } else pw.style.display="none";
}

function render(){
  const app=document.getElementById("app");
  updProg();

  if(state==="intro"){
    app.innerHTML=`
    <div class="card">
      <div class="intro-ttl">Тавтай морилно уу!</div>
      <div class="intro-p">Энэхүү судалгаа нь <strong>AHP аргаар</strong> төмөр замын маршрут сонгох шалгуур үзүүлэлтүүдийн харьцангуй жинг тодорхойлоход зориулагдсан.</div>
      <div class="slist">
        <div class="si"><div class="sn">1</div><div class="st">Нэрээ оруулна уу</div></div>
        <div class="si"><div class="sn">2</div><div class="st"><strong>${TOTAL} хос</strong> шалгуурыг харьцуулж, аль нь чухал болохыг заана</div></div>
        <div class="si"><div class="sn">3</div><div class="st">Дуусмагц таны хариу автоматаар нэгдсэн системд хадгалагдана</div></div>
      </div>
      <div class="scl">
        <h4>Харьцуулалтын оноо</h4>
        <div class="sr"><span class="sv">1</span><span>Тэнцүү чухал</span></div>
        <div class="sr"><span class="sv">3</span><span>Бага зэрэг давуу</span></div>
        <div class="sr"><span class="sv">5</span><span>Чухал давуу</span></div>
        <div class="sr"><span class="sv">7</span><span>Маш давуу</span></div>
        <div class="sr"><span class="sv">9</span><span>Хамгийн их давуу</span></div>
      </div>
      <input class="ni" type="text" id="nIn" placeholder="Таны нэр..." maxlength="30" inputmode="text">
      <div class="nh">Нэр нь үр дүнд ялгах зорилгоор хэрэглэгдэнэ</div>
      <button class="sbtn" onclick="doStart()">Судалгаа эхлэх →</button>
    </div>`;
    const inp=document.getElementById("nIn");
    if(inp) setTimeout(()=>inp.focus(),100);
    return;
  }

  if(state==="survey"){
    const [i,j]=pairs[cur];
    const sv0=answers[cur], isL=sv0<8, isR=sv0>8;
    app.innerHTML=`
    <div class="card">
      <div class="qn">Асуулт ${cur+1} / ${TOTAL}</div>
      <div class="qi">Доорх хоёр шалгуурын аль нь илүү чухал вэ?</div>
      <div class="cg">
        <div class="cp${isL?" al":""}">
          <div class="code">${crits[i].id}</div>
          <div class="nm">${crits[i].label}</div>
        </div>
        <div class="vs">эсвэл</div>
        <div class="cp${isR?" ar":""}">
          <div class="code">${crits[j].id}</div>
          <div class="nm">${crits[j].label}</div>
        </div>
      </div>
      <div class="slw">
        <div class="sll">
          <span>← Зүүн тал маш чухал</span>
          <span>Тэнцүү</span>
          <span>Баруун тал маш чухал →</span>
        </div>
        <input type="range" min="0" max="16" step="1" value="${sv0}" id="sl"
          oninput="answers[cur]=parseInt(this.value);rfrsh(this.value)">
        <div class="cl" id="ch">${slbl(sv0)}</div>
      </div>
      <div class="br">
        <button class="btn" onclick="prevQ()" ${cur===0?"disabled":""}>← Өмнөх</button>
        <button class="btn btn-p" onclick="nextQ()">${cur<TOTAL-1?"Дараах →":"✓ Илгээх"}</button>
      </div>
    </div>`;
    return;
  }

  if(state==="saving"){
    app.innerHTML=`<div class="card" style="text-align:center;padding:32px 16px">
      <div style="font-size:36px;margin-bottom:12px">⏳</div>
      <div style="font-size:15px;color:var(--tm)">Хадгалж байна...</div>
    </div>`;
    return;
  }

  if(state==="done"){
    const CR=computeCR(answers);
    const crOk=CR<0.1, crWarn=CR<0.2;
    const crColor=crOk?"var(--g)":crWarn?"#d97706":"#dc2626";
    const crTxt=crOk?"Тогтворжилт сайн ✓":crWarn?"Дунд зэрэг — зарим хариу нь тогтворгүй":"Тогтворгүй — дахин шалгана уу";
    app.innerHTML=`
    <div class="card">
      <div class="done-ic">✅</div>
      <div class="done-ttl">Баярлалаа!</div>
      <div class="done-p">Таны хариу амжилттай хадгалагдлаа.<br>Одоо энэ цонхыг хаах боломжтой.</div>
      <div class="sg">
        <div class="st2"><div class="sv2">${TOTAL}</div><div class="sl2">Нийт асуулт</div></div>
        <div class="st2"><div class="sv2" style="color:${crColor}">${(CR*100).toFixed(1)}%</div><div class="sl2">CR индекс</div></div>
      </div>
      <div class="nb" style="color:${crColor};border-color:${crColor}40;background:${crColor}10">
        ${crTxt}
      </div>
      <button class="btn" style="width:100%;margin-top:14px" onclick="restart()">🔄 Дахин хийх</button>
    </div>`;
    return;
  }

  if(state==="error"){
    app.innerHTML=`
    <div class="card">
      <div class="err">
        <strong>Алдаа гарлаа.</strong> Хадгалж чадсангүй.<br>
        Интернэт холболтоо шалгаад дахин оролдоно уу.
      </div>
      <button class="btn btn-p" style="width:100%" onclick="doSubmit()">🔄 Дахин оролдох</button>
      <button class="btn" style="width:100%;margin-top:8px" onclick="state='survey';render()">← Буцах</button>
    </div>`;
  }
}

function rfrsh(val){
  document.getElementById("ch").textContent=slbl(val);
  const v=parseInt(val);
  const p=document.querySelectorAll(".cp");
  if(p.length>=2){ p[0].className="cp"+(v<8?" al":""); p[1].className="cp"+(v>8?" ar":""); }
}

function doStart(){
  const inp=document.getElementById("nIn");
  const nm=(inp?inp.value.trim():"");
  if(!nm){ if(inp){inp.style.borderColor="#dc2626";inp.focus();} return; }
  uname=nm; state="survey"; cur=0; answers=new Array(TOTAL).fill(8); render(); window.scrollTo(0,0);
}

function prevQ(){ if(cur>0){cur--;render();window.scrollTo(0,0);} }

function nextQ(){
  const sl=document.getElementById("sl");
  if(sl) answers[cur]=parseInt(sl.value);
  if(cur<TOTAL-1){ cur++; render(); window.scrollTo(0,0); }
  else doSubmit();
}

async function doSubmit(){
  state="saving"; render();
  const CR=computeCR(answers);
  const payload={name:uname,answers:[...answers],cr:+CR.toFixed(4)};
  const encoded=encodeURIComponent(JSON.stringify(payload));
  return new Promise((resolve)=>{
    const cb="sc"+Date.now();
    window[cb]=(r)=>{
      delete window[cb];
      const s=document.getElementById("_sc");
      if(s)s.remove();
      state=r&&r.success?"done":"error";
      render();window.scrollTo(0,0);
      resolve();
    };
    const s=document.createElement("script");
    s.id="_sc";
    s.onerror=()=>{ delete window[cb]; state="error"; render(); resolve(); };
    s.src=API_URL+"?method=post&data="+encoded+"&callback="+cb;
    document.head.appendChild(s);
    setTimeout(()=>{ if(window[cb]){ delete window[cb]; state="done"; render(); resolve(); } },10000);
  });
}

function restart(){ state="intro"; cur=0; answers=new Array(TOTAL).fill(8); uname=""; render(); }

render();
</script>
</body>
</html>
